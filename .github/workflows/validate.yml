name: validate
on:
  push:
    paths:
      - '.agents/skills/**'
      - 'templates/**'
      - 'scripts/**'
  pull_request:
    paths:
      - '.agents/skills/**'
      - 'templates/**'
      - 'scripts/**'
jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: python scripts/validate.py
  release-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: python scripts/release_sync.py --check
      - run: git diff --exit-code
